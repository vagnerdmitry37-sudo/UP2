<p-card class="card">
  <h1 class="title">Log in</h1>

  <form class="form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="field">
      <label for="email">Email</label>
      <input
        pInputText
        id="email"
        type="email"
        formControlName="email"
        autocomplete="email"
        fluid
        [invalid]="showsError('email')"
      />
      @if (showsError('email')) {
        <p-message severity="error" size="small" variant="simple">Enter a valid email.</p-message>
      }
    </div>

    <div class="field">
      <label for="password">Password</label>
      <p-password
        inputId="password"
        formControlName="password"
        autocomplete="current-password"
        [feedback]="false"
        toggleMask
        fluid
        [invalid]="showsError('password')"
      />
      @if (showsError('password')) {
        <p-message severity="error" size="small" variant="simple">Enter your password.</p-message>
      }
    </div>

    @if (credentialsRejected()) {
      <p-message severity="error">Email or password is incorrect.</p-message>
    }

    <p-button type="submit" label="Log in" fluid [loading]="submitting()" />
  </form>
</p-card>
